<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prihajajoča ocenjevanja – G4Asistent</title><style>:root{color-scheme:dark;--bg:#0b0e15;--panel:#141925;--edge:#303a4d;--text:#f4f5fa;--muted:#9ba6b9;--accent:#8e9fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#29325a,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100dvh}.wrap{max-width:930px;margin:auto;padding:22px 18px 75px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:var(--accent)}.brand{font-weight:800;font-size:19px;letter-spacing:-.05em;text-decoration:none;color:var(--text)}.brand b{color:var(--accent)}.nav{display:flex;gap:8px}button,.btn{font:inherit;border:1px solid var(--edge);background:#1b2230;color:var(--text);border-radius:10px;padding:10px 13px;font-size:13px;font-weight:650;cursor:pointer;text-decoration:none}button:hover,.btn:hover{background:#283247}.primary{background:var(--accent);border-color:var(--accent);color:#101522}.eyebrow{color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.18em;text-transform:uppercase;margin-top:54px}h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.055em;margin:10px 0}h2{font-size:20px}.muted{color:var(--muted)}.lead{color:var(--muted);margin:0 0 28px}.panel{border:1px solid var(--edge);border-radius:17px;background:var(--panel);padding:21px}.section{margin-top:28px}.items{display:grid;gap:11px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px}.item strong{font-size:17px}.details{font-size:13px;color:var(--muted);margin-top:6px}.date{font-weight:700;color:var(--accent);white-space:nowrap}.notice{margin:20px 0;color:var(--muted)}label{display:block;color:#cbd3e0;font-size:13px;font-weight:650;margin:16px 0 7px}input,select{display:block;width:100%;background:#0e131d;color:var(--text);border:1px solid var(--edge);border-radius:10px;min-height:44px;padding:10px;font:inherit}.form{max-width:550px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.wide{grid-column:1/-1}.hidden{display:none!important}.danger{color:#ff9eaa}@media(max-width:550px){header{flex-wrap:wrap}.nav{gap:5px}.nav .btn{padding:8px}.grid{grid-template-columns:1fr}.item{align-items:flex-start}.eyebrow{margin-top:35px}}</style></head><body><div class="wrap"><header><a class="brand" href="../"><b>G4A</b>sistent</a><nav class="nav"><a class="btn" href="../">← Moje ocene</a></nav></header><div class="eyebrow">Razredni koledar</div><h1>Prihajajoča ocenjevanja.</h1><p class="lead">Napovedani pisni, ustni in projektni preizkusi za tvoj razred.</p><p id="notice" class="notice">Nalaganje …</p><main id="main" class="hidden"><h2>Prihajajoča ocenjevanja</h2><div id="future" class="items"></div><section class="section"><h2>Pretekla ocenjevanja</h2><p class="muted" style="font-size:13px">Prikazana so do šest dni po dnevu ocenjevanja.</p><div id="past" class="items"></div></section></main></div><script src="../config.js"></script><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const $=id=>document.getElementById(id);const labels={slo:'Slovenščina',mat:'Matematika',ang:'Angleščina',nem:'Nemščina',fiz:'Fizika','rač':'Računalništvo',rso:'RSO',ele:'Elektrotehnika',esi:'ESI','špo':'Športna vzgoja',fizm:'Fizika za maturo',psim:'Psihologija za maturo',zgom:'Zgodovina za maturo'};const fmt=d=>{const [y,m,day]=d.split('-');return day+'. '+m+'. '+y};const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const shift=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};const client=window.G4_CONFIG;const db=createClient(client.url,client.anonKey);
function item(g){const el=document.createElement('article');el.className='panel item';const left=document.createElement('div');const name=document.createElement('strong');name.textContent=labels[g.subject]||g.subject;const info=document.createElement('div');info.className='details';info.textContent={pisno:'Pisno',ustno:'Ustno',izdelek:'Izdelek'}[g.type]||g.type;left.append(name,info);const date=document.createElement('span');date.className='date';date.textContent=fmt(g.date);el.append(left,date);return el}
async function load(){try{const user=JSON.parse(sessionStorage.getItem('g4_simple_account')||'null');if(!user?.name||!user?.password){$('notice').textContent='Za ogled ocenjevanj se najprej prijavi na strani Moje ocene.';return}const {data,error}=await db.rpc('g4a_api',{p_name:user.name,p_password:user.password,p_action:'assessments',p_data:{}});if(error)throw error;if(!data?.ok||!Array.isArray(data.items))throw Error(data?.message||'Posodobi podatkovno bazo z datoteko setup.sql.');const future=$('future'),past=$('past');future.replaceChildren();past.replaceChildren();let t=today();for(const g of data.items){(g.date>=t?future:past).append(item(g))}for(const el of [future,past])if(!el.children.length){const text=document.createElement('p');text.className='muted';text.textContent='Ni ocenjevanj.';el.append(text)}$('notice').classList.add('hidden');$('main').classList.remove('hidden')}catch(err){$('notice').textContent='Nalaganje ni uspelo: '+err.message}}load();
</script></body></html>
