<!doctype html>
<html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e15"><title>Statistika razreda – G4Asistent</title>
<style>
:root{color-scheme:dark;--bg:#0b0e15;--panel:#141925;--edge:#2c3446;--subtle:#9ba6b9;--text:#f5f6fb;--accent:#8e9fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 88% 0,#29325a,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{width:min(1060px,100%);padding:25px 20px 70px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:800;letter-spacing:-.05em;font-size:19px}.brand b{color:var(--accent)}.nav{display:flex;align-items:center;gap:8px}.btn{display:inline-block;text-decoration:none;color:var(--text);border:1px solid var(--edge);border-radius:12px;padding:10px 13px;background:#1b2230;font-size:13px;font-weight:650;cursor:pointer}.btn:hover{background:#283247}h1{font-size:clamp(32px,5vw,50px);letter-spacing:-.055em;margin:12px 0}.eyebrow{margin-top:55px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800}p{line-height:1.55}.muted{color:var(--subtle)}.intro{margin:0 0 30px;color:var(--subtle)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:30px}.stat,.test,.notice{background:var(--panel);border:1px solid var(--edge);border-radius:17px;padding:20px}.stat span{font-size:12px;color:var(--subtle)}.stat strong{display:block;font-size:29px;margin-top:8px;overflow-wrap:anywhere}.test-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.test{padding:22px;min-width:0}.test-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.test h2{font-size:18px;margin:0 0 5px;letter-spacing:-.025em}.date{color:var(--subtle);font-size:12px}.average{font-size:24px;letter-spacing:-.04em;font-weight:800;color:var(--accent)}.bars{display:grid;gap:8px;margin-top:23px}.bar-row{display:grid;grid-template-columns:18px 1fr 26px;align-items:center;gap:10px;font-size:12px}.track{height:9px;border-radius:99px;overflow:hidden;background:#293247}.fill{height:100%;background:var(--accent);border-radius:99px}.bar-row strong{text-align:right;font-weight:600;color:var(--subtle)}.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--edge);padding-top:15px;margin-top:20px;color:var(--subtle);font-size:12px}.notice{margin-top:25px}.hidden{display:none!important}.notice a{color:var(--accent)}@media(max-width:650px){.wrap{padding:17px 15px 60px}.eyebrow{margin-top:38px}.summary{gap:8px}.stat{padding:13px}.stat strong{font-size:22px}.test-list{grid-template-columns:1fr}.nav{gap:5px}.nav .btn{padding:8px;font-size:12px}}@media(max-width:360px){.summary{grid-template-columns:1fr}.stat strong{font-size:25px}}
</style></head>
<body><div class="wrap"><header class="top"><div class="brand"><b>G4A</b>sistent <span class="muted" style="font-size:12px;font-weight:400">/ statistika</span></div><div class="nav"><a href="../" class="btn">← Moje ocene</a><button id="reload" class="btn" type="button">↻</button></div></header>
<div class="eyebrow">Skupni pregled</div><h1>Statistika razreda<span style="color:var(--accent)">.</span></h1>
<p class="intro">Pisne ocene dijakov istega razreda, združene po predmetu in tridnevnem obdobju. Brez uporabniških imen.</p>
<div id="notice" class="notice" role="status">Nalaganje statistike …</div>
<main id="content" class="hidden"><section class="summary"><div class="stat"><span>Razred</span><strong id="class-name">—</strong></div><div class="stat"><span>Pisni testi</span><strong id="test-count">0</strong></div><div class="stat"><span>Zabeležene ocene</span><strong id="grade-count">0</strong></div></section><div id="tests" class="test-list"></div></main></div>
<script src="../config.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id);
const subjects=[['slo','Slovenščina'],['mat','Matematika'],['ang','Angleščina'],['nem','Nemščina'],['fiz','Fizika'],['rač','Računalništvo'],['rso','RSO'],['ele','Elektrotehnika'],['esi','ESI'],['špo','Športna vzgoja'],['fizm','Fizika za maturo'],['psim','Psihologija za maturo'],['zgom','Zgodovina za maturo']];
const nameOf=Object.fromEntries(subjects);
const dateLabel=d=>{const [y,m,day]=d.split('-');return day+'. '+m+'. '+y};
const asDate=d=>Date.parse(d+'T12:00:00Z');
function groupTests(grades){const output=[];for(const [subject] of subjects){const entries=grades.filter(g=>g.subject===subject).sort((a,b)=>a.date.localeCompare(b.date));let current=null;for(const g of entries){if(!current||asDate(g.date)-asDate(current.start)>2*86400000){current={subject,start:g.date,end:g.date,grades:[]};output.push(current)}current.grades.push(g);current.end=g.date}}return output.sort((a,b)=>b.start.localeCompare(a.start)||subjects.findIndex(x=>x[0]===a.subject)-subjects.findIndex(x=>x[0]===b.subject))}
function render(info){$('class-name').textContent=info.class_name||'—';const groups=groupTests(info.grades||[]);$('test-count').textContent=groups.length;$('grade-count').textContent=String((info.grades||[]).length);const root=$('tests');root.replaceChildren();if(!groups.length){const p=document.createElement('div');p.className='notice';p.textContent='Za ta razred še ni zabeleženih pisnih ocen.';root.append(p)}
for(const group of groups){const card=document.createElement('article');card.className='test';const head=document.createElement('div');head.className='test-head';const a=document.createElement('div');const title=document.createElement('h2');title.textContent=nameOf[group.subject]||group.subject;const dates=document.createElement('div');dates.className='date';dates.textContent=dateLabel(group.start)+(group.end!==group.start?' – '+dateLabel(group.end):'');a.append(title,dates);const avg=document.createElement('div');avg.className='average';avg.textContent=(group.grades.reduce((sum,g)=>sum+Number(g.value),0)/group.grades.length).toLocaleString('sl-SI',{minimumFractionDigits:2,maximumFractionDigits:2});head.append(a,avg);card.append(head);
const counts=[1,2,3,4,5].map(n=>group.grades.filter(g=>Number(g.value)===n).length);const bars=document.createElement('div');bars.className='bars';for(let n=1;n<=5;n++){const row=document.createElement('div');row.className='bar-row';const label=document.createElement('span');label.textContent=n;const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=(counts[n-1]/group.grades.length*100)+'%';track.append(fill);const count=document.createElement('strong');count.textContent=counts[n-1];row.append(label,track,count);bars.append(row)}card.append(bars);
const foot=document.createElement('div');foot.className='foot';const count=document.createElement('span');count.textContent=group.grades.length+' vpisanih ocen';const perc=group.grades.filter(g=>g.percent!==null&&g.percent!==undefined);const pct=document.createElement('span');pct.textContent=perc.length?'Povp. uspešnost: '+(perc.reduce((sum,g)=>sum+Number(g.percent),0)/perc.length).toLocaleString('sl-SI',{maximumFractionDigits:1})+' %':'Brez podatkov o procentih';foot.append(count,pct);card.append(foot);root.append(card)}}
async function load(){const notice=$('notice');notice.classList.remove('hidden');notice.textContent='Nalaganje statistike …';$('content').classList.add('hidden');try{let account=JSON.parse(sessionStorage.getItem('g4_simple_account')||'null');if(!account?.name||!account?.password){notice.textContent='Za ogled statistike se najprej prijavi na strani Moje ocene.';return}const cfg=window.G4_CONFIG;if(!cfg?.url||!cfg?.anonKey)throw Error('Manjka povezava s podatkovno bazo.');const db=createClient(cfg.url,cfg.anonKey);const {data,error}=await db.rpc('g4a_api',{p_name:account.name,p_password:account.password,p_action:'class_stats',p_data:{}});if(error)throw error;if(!data||!Array.isArray(data.grades))throw Error('Najprej izvedi posodobljeno datoteko setup.sql v Supabase.');render(data);notice.classList.add('hidden');$('content').classList.remove('hidden')}catch(e){notice.textContent='Statistike ni mogoče naložiti: '+e.message}}
$('reload').onclick=load;load();
</script></body></html>
