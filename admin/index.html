<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administracija ocenjevanj – G4Asistent</title><style>:root{color-scheme:dark;--bg:#0b0e15;--panel:#141925;--edge:#303a4d;--text:#f4f5fa;--muted:#9ba6b9;--accent:#8e9fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#29325a,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100dvh}.wrap{max-width:930px;margin:auto;padding:22px 18px 75px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:var(--accent)}.brand{font-weight:800;font-size:19px;letter-spacing:-.05em;text-decoration:none;color:var(--text)}.brand b{color:var(--accent)}.nav{display:flex;gap:8px}button,.btn{font:inherit;border:1px solid var(--edge);background:#1b2230;color:var(--text);border-radius:10px;padding:10px 13px;font-size:13px;font-weight:650;cursor:pointer;text-decoration:none}button:hover,.btn:hover{background:#283247}.primary{background:var(--accent);border-color:var(--accent);color:#101522}.eyebrow{color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.18em;text-transform:uppercase;margin-top:54px}h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.055em;margin:10px 0}h2{font-size:20px}.muted{color:var(--muted)}.lead{color:var(--muted);margin:0 0 28px}.panel{border:1px solid var(--edge);border-radius:17px;background:var(--panel);padding:21px}.section{margin-top:28px}.items{display:grid;gap:11px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px}.item strong{font-size:17px}.details{font-size:13px;color:var(--muted);margin-top:6px}.date{font-weight:700;color:var(--accent);white-space:nowrap}.notice{margin:20px 0;color:var(--muted)}label{display:block;color:#cbd3e0;font-size:13px;font-weight:650;margin:16px 0 7px}input,select{display:block;width:100%;background:#0e131d;color:var(--text);border:1px solid var(--edge);border-radius:10px;min-height:44px;padding:10px;font:inherit}.form{max-width:550px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.wide{grid-column:1/-1}.hidden{display:none!important}.danger{color:#ff9eaa}@media(max-width:550px){header{flex-wrap:wrap}.nav{gap:5px}.nav .btn{padding:8px}.grid{grid-template-columns:1fr}.item{align-items:flex-start}.eyebrow{margin-top:35px}}</style></head><body><div class="wrap"><header><a class="brand" href="../"><b>G4A</b>sistent</a><nav class="nav"><a class="btn" href="../ocenjevanja/">Pregled ocenjevanj</a></nav></header><div class="eyebrow">Upravljanje ocenjevanj</div><h1>Administracija.</h1><p class="lead">Dodajaj ocenjevanja za posamezne razrede.</p><section id="login-section" class="panel form"><form id="auth"><label for="password">Administratorsko geslo</label><input type="password" id="password" required autocomplete="off"><button class="primary" style="margin-top:18px">Odkleni</button><p id="auth-error" class="danger"></p></form></section><main id="main" class="hidden"><section class="panel form"><h2>Dodaj ocenjevanje</h2><form id="form"><div class="grid"><div><label for="subject">Predmet</label><select id="subject" required></select></div><div><label for="type">Vrsta ocenjevanja</label><select id="type" required><option value="pisno">Pisno</option><option value="ustno">Ustno</option><option value="izdelek">Izdelek</option></select></div><div><label for="date">Datum</label><input id="date" type="date" required></div><div><label for="class-name">Razred</label><input id="class-name" value="G4A" required maxlength="60"></div></div><button class="primary" style="margin-top:19px">Shrani ocenjevanje</button><p id="feedback" class="notice"></p></form></section><section class="section"><h2>Vpisana ocenjevanja</h2><div class="items" id="list"></div></section></main></div><script src="../config.js"></script><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const $=id=>document.getElementById(id);const labels={slo:'Slovenščina',mat:'Matematika',ang:'Angleščina',nem:'Nemščina',fiz:'Fizika','rač':'Računalništvo',rso:'RSO',ele:'Elektrotehnika',esi:'ESI','špo':'Športna vzgoja',fizm:'Fizika za maturo',psim:'Psihologija za maturo',zgom:'Zgodovina za maturo'};const fmt=d=>{const [y,m,day]=d.split('-');return day+'. '+m+'. '+y};const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const shift=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};const client=window.G4_CONFIG;const db=createClient(client.url,client.anonKey);
let pass='';for(const [value,label] of Object.entries(labels)){const o=document.createElement('option');o.value=value;o.textContent=label;$('subject').append(o)}$('date').value=today();
async function api(action,data={}){const r=await db.rpc('g4a_admin',{p_password:pass,p_action:action,p_data:data});if(r.error)throw r.error;if(!r.data?.ok)throw Error(r.data?.message||'Napaka.');return r.data}
async function render(){const result=await api('list');$('list').replaceChildren();if(!result.items.length){$('list').textContent='Ni vpisanih ocenjevanj.';return}for(const g of result.items){const card=document.createElement('div');card.className='panel item';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=labels[g.subject]||g.subject;const sub=document.createElement('div');sub.className='details';sub.textContent=g.class_name+' · '+g.type+' · '+fmt(g.date);info.append(title,sub);const remove=document.createElement('button');remove.className='danger';remove.textContent='Izbriši';remove.onclick=async()=>{if(!confirm('Izbrišem ocenjevanje?'))return;try{await api('delete',{id:g.id});await render()}catch(e){$('feedback').textContent=e.message}};card.append(info,remove);$('list').append(card)}}
$('auth').onsubmit=async e=>{e.preventDefault();pass=$('password').value;try{await api('login');$('password').value='';$('auth-error').textContent='';$('login-section').classList.add('hidden');$('main').classList.remove('hidden');await render()}catch(err){$('auth-error').textContent=err.message;pass=''}};
$('form').onsubmit=async e=>{e.preventDefault();try{await api('add',{subject:$('subject').value,type:$('type').value,date:$('date').value,class_name:$('class-name').value.trim()});$('feedback').textContent='Ocenjevanje shranjeno.';await render()}catch(err){$('feedback').textContent=err.message}};
</script></body></html>
